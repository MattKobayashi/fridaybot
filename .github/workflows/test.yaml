---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
env:
  REPO_NAME: mattkobayashi
  IMAGE_NAME: fridaybot
jobs:
  image:
    name: Image
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      # Add support for more platforms with QEMU (optional)
      # https://github.com/docker/setup-qemu-action
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      # Set up Docker Buildx
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Build and export image to Docker daemon
      # https://github.com/docker/build-push-action
      - name: Build and export to Docker
        id: build-export
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          load: true
          tags: "${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:test"
      # Install uuid-runtime
      - name: Install uuid-runtime
        run: |
          set -x
          sudo apt-get --no-install-recommends --yes install uuid-runtime
      # Test the built image
      - name: Test image
        run: |
          set -x
          docker container run --attach=stdout --attach=stderr --entrypoint python3 --env RUN_TESTS=true --init --rm ${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:test main.py
      - name: Execute image
        run: |
          set -x
          CONTAINER_ID="$(uuidgen)"
          docker container run --attach=stdout --attach=stderr --init --name=$CONTAINER_ID --rm ${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:test &
          sleep 10
          docker container stop $CONTAINER_ID
name: Test
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
